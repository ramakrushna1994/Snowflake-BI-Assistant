name: Run 100-Question Test Suite

on:
  workflow_dispatch:
    inputs:
      domain_filter:
        description: 'Limit to one domain (SALES / HR / FINANCE / COMPLEX) or leave blank for all 100'
        required: false
        default: ''

jobs:
  test:
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 15     # hard cap — job auto-cancels if it runs over

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install snowflake-connector-python pandas

      - name: Run 100-question test suite
        env:
          SF_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          DOMAIN_FILTER: ${{ github.event.inputs.domain_filter }}
        run: python run_100_tests.py

      - name: Upload results CSV
        if: always()          # upload even on partial failure
        uses: actions/upload-artifact@v4
        with:
          name: dataforge-test-results-${{ github.run_number }}
          path: test_results.csv
          retention-days: 30
