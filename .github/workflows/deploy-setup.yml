name: Deploy Setup Scripts to Snowflake

on:
  push:
    branches: [main]
    paths:
      - 'setup/**'

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      changed_scripts: ${{ steps.changed.outputs.scripts }}
      has_changes: ${{ steps.changed.outputs.has_changes }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed SQL scripts
        id: changed
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- 'setup/*.sql' | sort)
          if [ -z "$CHANGED" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "scripts=" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            # Newline-separated list encoded for output
            echo "scripts<<EOF" >> $GITHUB_OUTPUT
            echo "$CHANGED" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            echo "Changed scripts:"
            echo "$CHANGED"
          fi

  approve-and-deploy:
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Snow CLI
        run: pip install snowflake-cli

      - name: Create Snow CLI config
        run: |
          mkdir -p ~/.snowflake
          cat > ~/.snowflake/config.toml << EOF
          [connections.default]
          account = "${{ secrets.SNOWFLAKE_ACCOUNT }}"
          user = "RAMAKRUSHNA"
          password = "${{ secrets.SNOWFLAKE_PASSWORD }}"
          warehouse = "BI_ASSISTANT_WH"
          database = "CONVERSATIONAL_BI"
          schema = "APP"
          EOF
          chmod 0600 ~/.snowflake/config.toml

      - name: Display scripts to execute
        run: |
          echo "The following SQL scripts will be executed:"
          echo "${{ needs.detect-changes.outputs.changed_scripts }}"

      - name: Execute changed SQL scripts
        run: |
          echo "${{ needs.detect-changes.outputs.changed_scripts }}" | while read script; do
            if [ -n "$script" ]; then
              echo "▶ Executing: $script"
              snow sql -f "$script" --connection default
              echo "✓ Completed: $script"
            fi
          done

      - name: Verify
        run: |
          snow sql -q "SELECT CURRENT_DATABASE(), CURRENT_SCHEMA(), CURRENT_TIMESTAMP()" --connection default
